<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Formation & Fill Gap Pro v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        #range-screen, #main-content, #print-section { display: none; }
        #timer-bar { transition: width 1s linear; }
        .correct-flash { animation: flash-green 0.5s; }
        .wrong-flash { animation: flash-red 0.5s; }
        @keyframes flash-green { 0% { background-color: rgba(16, 185, 129, 0.2); } 100% { background-color: transparent; } }
        @keyframes flash-red { 0% { background-color: rgba(220, 38, 38, 0.2); } 100% { background-color: transparent; } }

        /* Cấu trúc cho in PDF */
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            #main-content, #range-screen, #lock-screen { display: none !important; }
            #print-section { display: block !important; padding: 20mm; font-size: 13pt; line-height: 1.6; }
            .print-question { margin-bottom: 35px; page-break-inside: avoid; }
            .print-keyword { font-weight: bold; margin: 8px 0; }
            .print-line { border-bottom: 1px solid #000; height: 30px; width: 100%; margin-top: 5px; }
            .page-break { page-break-before: always; }
            .print-header { border-bottom: 2px solid #000; margin-bottom: 30px; padding-bottom: 10px; font-weight: bold; font-size: 18pt; text-align: center; }
            .print-answer-item { margin-bottom: 20px; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="lock-screen" class="w-full max-w-md bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl text-center">
        <div class="text-5xl mb-4">🔐</div>
        <h2 class="text-2xl font-bold mb-6 text-sky-400">Mật mã bí mật</h2>
        <input type="password" id="pass-input" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl text-center text-2xl mb-4 outline-none focus:border-sky-500" placeholder="****" value="1234">
        <button onclick="checkPass()" class="w-full bg-sky-500 py-4 rounded-2xl font-bold hover:bg-sky-600 transition-all">VÀO GAME</button>
    </div>

    <div id="range-screen" class="w-full max-w-md bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-emerald-400 text-center">Thiết lập bài học</h2>
        
        <label class="block mb-6 bg-slate-800 p-4 rounded-2xl cursor-pointer border border-dashed border-slate-600 hover:bg-slate-700 transition-all text-center">
            <span id="file-status">📁 Nạp file CSV (5 cột: Chủ đề, Câu hỏi, Từ gốc, Đáp án, Giải thích)</span>
            <input type="file" id="csv-file" accept=".csv" class="hidden">
        </label>
        
        <!-- Phần chọn Chủ đề -->
        <div id="topic-container" class="mb-6 hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-sky-400 uppercase font-bold">Chọn chủ đề</span>
                <button onclick="toggleAllTopics()" id="btn-all-topics" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg border border-slate-700 font-bold text-slate-300 transition-all">ALL</button>
            </div>
            <div id="topic-list" class="max-h-40 overflow-y-auto bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                <!-- Danh sách checkbox chủ đề sẽ được render tự động ở đây -->
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
            <div>
                <span class="text-xs text-slate-500 block mb-1 uppercase">Từ câu (From)</span>
                <input type="number" id="range-start" class="w-full bg-slate-800 p-3 rounded-xl text-center border border-slate-700 font-bold text-white" value="1">
            </div>
            <div>
                <span class="text-xs text-slate-500 block mb-1 uppercase">Đến câu (To - Max: <span id="max-count">0</span>)</span>
                <input type="number" id="range-end" class="w-full bg-slate-800 p-3 rounded-xl text-center border border-slate-700 font-bold text-white" value="0">
            </div>
        </div>

        <div class="mb-6">
            <span class="text-xs text-rose-400 block mb-1 uppercase font-bold">Thời gian mỗi câu (Giây)</span>
            <input type="number" id="time-limit" class="w-full bg-rose-950/30 p-3 rounded-xl text-center border border-rose-900/50 font-bold text-rose-400 outline-none" value="300">
        </div>

        <div class="flex gap-4">
            <button onclick="exportPDF()" class="flex-1 bg-slate-700 py-4 rounded-2xl font-bold hover:bg-slate-600 transition-all text-sm uppercase">Xuất PDF</button>
            <button onclick="startGame()" class="flex-1 bg-emerald-500 py-4 rounded-2xl font-bold hover:bg-emerald-600 transition-all text-sm uppercase">Bắt đầu học</button>
        </div>
    </div>

    <div id="main-content" class="w-full max-w-3xl">
        <div class="flex justify-between items-center mb-4 px-2">
            <span id="progress-text" class="text-slate-500 font-mono">CÂU: 1/10</span>
            <span id="score-text" class="text-emerald-400 font-bold uppercase tracking-widest">Đúng: 0</span>
        </div>

        <div class="mb-6 px-2">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-bold uppercase">
                <span>⏱ Áp lực thời gian</span>
                <span id="timer-text" class="text-rose-400">300s</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="timer-bar" class="bg-rose-500 h-2 rounded-full" style="width: 100%"></div>
            </div>
        </div>

        <div class="bg-slate-900 p-6 md:p-10 rounded-[3rem] border border-slate-800 shadow-xl flex flex-col justify-between">
            <div>
                <p id="question-text" class="text-xl md:text-2xl font-medium leading-relaxed mb-4 text-white text-center whitespace-pre-wrap break-words"></p>
                
                <div class="text-center mb-8">
                    <span id="keyword-text" class="inline-block bg-indigo-900/50 text-indigo-300 border border-indigo-500/50 px-6 py-2 rounded-full font-bold tracking-widest text-lg uppercase"></span>
                </div>
                
                <input type="text" id="user-input" class="w-full bg-slate-950 border-2 border-slate-700 p-5 rounded-2xl text-xl text-center text-white outline-none focus:border-sky-500 transition-all mb-4" placeholder="Gõ đáp án của bé vào đây..." autocomplete="off">
            </div>

            <div>
                <div id="explanation" class="hidden mt-4 p-5 rounded-2xl bg-slate-950 border border-slate-800 text-sm leading-relaxed text-slate-300 whitespace-pre-wrap break-words"></div>

                <div class="flex gap-4 mt-6">
                    <button id="btn-check" onclick="checkAnswer()" class="flex-1 bg-sky-500 py-5 rounded-2xl font-bold hover:bg-sky-600 transition-all text-lg shadow-lg">KIỂM TRA</button>
                    <button id="btn-next" onclick="nextQuestion()" class="hidden flex-1 bg-emerald-600 py-5 rounded-2xl font-bold hover:bg-emerald-700 transition-all text-lg shadow-lg">CÂU TIẾP THEO →</button>
                </div>
            </div>
        </div>
    </div>

    <div id="print-section"></div>

    <script>
        let fullData = [], currentSession = [], index = 0, score = 0;
        let timerInterval, timePerQuestion = 300, timeLeft = 0;
        let allTopicsSelected = true;
        const SECRET_PASS = "1234";

        function checkPass() {
            if (document.getElementById('pass-input').value === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('range-screen').style.display = 'block';
            } else {
                alert("Sai mật mã!");
            }
        }

        function parseCSVLine(text) {
            let p = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p);
            return r;
        }

        // Nạp file 5 cột: [0]: Chủ đề, [1]: Câu hỏi, [2]: Từ gốc, [3]: Đáp án, [4]: Giải thích
        document.getElementById('csv-file').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const lines = event.target.result.split(/\r?\n/);
                fullData = lines.map(line => {
                    if (!line.trim()) return null;
                    const cols = parseCSVLine(line);
                    return { 
                        topic:   cols[0]?.trim().replace(/^"|"$/g, ''),     // Cột 1: Chủ đề
                        q:       cols[1]?.trim().replace(/^"|"$/g, ''),     // Cột 2: Câu hỏi
                        keyword: cols[2]?.trim().replace(/^"|"$/g, ''),     // Cột 3: Từ gốc
                        ans:     cols[3]?.trim().replace(/^"|"$/g, ''),     // Cột 4: Đáp án
                        exp:     cols[4]?.trim().replace(/^"|"$/g, '')      // Cột 5: Giải thích
                    };
                }).filter(item => item && item.q && item.ans);
                
                document.getElementById('file-status').innerText = `✅ Đã nạp thành công ${fullData.length} câu`;
                
                // Hiển thị phần chọn chủ đề và tạo danh sách checkbox chủ đề duy nhất
                buildTopicList();
                updateFilteredRange();
            };
            reader.readAsText(e.target.files[0]);
        });

        function buildTopicList() {
            const topics = [...new Set(fullData.map(item => item.topic || "Chưa phân loại"))];
            const container = document.getElementById('topic-list');
            container.innerHTML = "";
            
            topics.forEach(topic => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-sm text-slate-300 cursor-pointer hover:text-white";
                label.innerHTML = `
                    <input type="checkbox" value="${topic}" checked class="topic-checkbox w-4 h-4 rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0" onchange="updateFilteredRange()">
                    <span class="truncate">${topic}</span>
                `;
                container.appendChild(label);
            });

            document.getElementById('topic-container').style.display = 'block';
            allTopicsSelected = true;
            document.getElementById('btn-all-topics').classList.replace('bg-slate-800', 'bg-sky-600');
        }

        function toggleAllTopics() {
            allTopicsSelected = !allTopicsSelected;
            const checkboxes = document.querySelectorAll('.topic-checkbox');
            checkboxes.forEach(cb => cb.checked = allTopicsSelected);
            
            const btn = document.getElementById('btn-all-topics');
            if (allTopicsSelected) {
                btn.classList.replace('bg-slate-800', 'bg-sky-600');
            } else {
                btn.classList.replace('bg-sky-600', 'bg-slate-800');
            }
            updateFilteredRange();
        }

        function getSelectedTopics() {
            const checkboxes = document.querySelectorAll('.topic-checkbox:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function getFilteredData() {
            const selectedTopics = getSelectedTopics();
            return fullData.filter(item => selectedTopics.includes(item.topic || "Chưa phân loại"));
        }

        function updateFilteredRange() {
            const filtered = getFilteredData();
            document.getElementById('max-count').innerText = filtered.length;
            document.getElementById('range-start').value = filtered.length > 0 ? 1 : 0;
            document.getElementById('range-end').value = filtered.length;
        }

        // Lắng nghe sự kiện thay đổi checkbox chủ đề để tự cập nhật lại Max range
        document.addEventListener('change', function(e) {
            if(e.target.classList.contains('topic-checkbox')) {
                updateFilteredRange();
            }
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function getRangeData() {
            const filtered = getFilteredData();
            const start = parseInt(document.getElementById('range-start').value) - 1;
            const end = parseInt(document.getElementById('range-end').value);
            return filtered.slice(Math.max(0, start), Math.min(filtered.length, end));
        }

        // ================= XUẤT PDF =================
        function exportPDF() {
            let data = getRangeData();
            if (data.length === 0) return alert("Vui lòng chọn chủ đề và khoảng câu hợp lệ!");
            
            // Xáo trộn thứ tự câu đã chọn trước khi xuất PDF
            shuffle(data);

            const printDiv = document.getElementById('print-section');
            let content = `<div class="print-header">BÀI TẬP ĐIỀN TỪ (WORD FORMATION)</div>`;
            
            // Trang 1: Đề bài
            data.forEach((item, i) => {
                content += `
                    <div class="print-question">
                        ${i + 1}. ${item.q}<br>
                        <div class="print-keyword">(${item.keyword})</div>
                        <div class="print-line"></div>
                    </div>
                `;
            });

            // Trang 2: Đáp án & Giải thích
            content += `<div class="page-break"></div><div class="print-header">HƯỚNG DẪN GIẢI CHI TIẾT</div>`;
            data.forEach((item, i) => {
                content += `
                    <div class="print-answer-item">
                        <strong>${i + 1}. ${item.ans}</strong><br>
                        <span style="font-style: italic; color: #444;">${item.exp || ""}</span>
                    </div>
                `;
            });

            printDiv.innerHTML = content;
            window.print();
        }

        // ================= CHƠI GAME =================
        function startGame() {
            currentSession = getRangeData();
            timePerQuestion = parseInt(document.getElementById('time-limit').value) || 300;
            
            if (currentSession.length === 0) return alert("Vui lòng chọn chủ đề và khoảng câu hợp lệ!");
            
            // Xáo trộn thứ tự câu đã chọn trước khi bắt đầu chơi
            shuffle(currentSession);
            index = 0; score = 0;
            
            document.getElementById('range-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = timePerQuestion;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('user-input').readOnly = true;
                    showFeedback(false, "Hết giờ!");
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-text').innerText = timeLeft + "s";
            const percent = (timeLeft / timePerQuestion) * 100;
            document.getElementById('timer-bar').style.width = percent + "%";
            document.getElementById('timer-bar').className = percent <= 30 ? "bg-red-600 h-2 rounded-full" : "bg-rose-500 h-2 rounded-full";
        }

        function showQuestion() {
            const current = currentSession[index];
            document.getElementById('question-text').innerText = current.q;
            
            const kwEl = document.getElementById('keyword-text');
            if(current.keyword) {
                kwEl.innerText = `(${current.keyword})`;
                kwEl.style.display = "inline-block";
            } else {
                kwEl.style.display = "none";
            }

            document.getElementById('progress-text').innerText = `CÂU: ${index + 1}/${currentSession.length}`;
            
            const inputEl = document.getElementById('user-input');
            inputEl.value = "";
            inputEl.readOnly = false;
            inputEl.className = "w-full bg-slate-950 border-2 border-slate-700 p-5 rounded-2xl text-xl text-center text-white outline-none focus:border-sky-500 transition-all mb-4";
            
            document.getElementById('explanation').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-check').classList.remove('hidden');

            startTimer();
            inputEl.focus();
        }

        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !document.getElementById('btn-check').classList.contains('hidden')) {
                event.preventDefault();
                checkAnswer();
            }
        });

        function checkAnswer() {
            clearInterval(timerInterval);
            
            const userVal = document.getElementById('user-input').value;
            const correctVal = currentSession[index].ans;

            const cleanText = (str) => str.toLowerCase().trim().replace(/[.\?]$/, '').replace(/\s+/g, ' ');

            const isCorrect = cleanText(userVal) === cleanText(correctVal);
            showFeedback(isCorrect);
        }

        function showFeedback(isCorrect, customTitle = null) {
            const current = currentSession[index];
            const inputEl = document.getElementById('user-input');
            const expDiv = document.getElementById('explanation');
            
            inputEl.readOnly = true;
            document.getElementById('btn-check').classList.add('hidden');

            if (isCorrect) {
                score++;
                inputEl.classList.replace('border-slate-700', 'border-emerald-500');
                inputEl.classList.add('text-emerald-400');
                
                expDiv.innerHTML = `<strong class="text-emerald-400">CHÍNH XÁC! 🌟</strong><br><span class="mt-2 block">${current.exp || ""}</span>`;
                expDiv.className = "mt-4 p-5 rounded-2xl bg-emerald-900/20 border border-emerald-500/30 text-sm leading-relaxed text-emerald-100 whitespace-pre-wrap break-words";
                
                document.getElementById('main-content').classList.add('correct-flash');
                setTimeout(() => document.getElementById('main-content').classList.remove('correct-flash'), 500);
            } else {
                inputEl.classList.replace('border-slate-700', 'border-red-500');
                inputEl.classList.add('text-red-400');
                
                const title = customTitle ? customTitle : "CHƯA CHÍNH XÁC ❌";
                expDiv.innerHTML = `<strong class="text-red-400">${title}</strong><br><strong class="text-sky-400 block mt-2">Đáp án chuẩn: ${current.ans}</strong><span class="mt-2 block">${current.exp || ""}</span>`;
                expDiv.className = "mt-4 p-5 rounded-2xl bg-red-900/20 border border-red-500/30 text-sm leading-relaxed text-red-100 whitespace-pre-wrap break-words";

                document.getElementById('main-content').classList.add('wrong-flash');
                setTimeout(() => document.getElementById('main-content').classList.remove('wrong-flash'), 500);
            }
            
            expDiv.classList.remove('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Đúng: ${score}`;
        }

        function nextQuestion() {
            index++;
            if (index < currentSession.length) {
                showQuestion();
            } else {
                clearInterval(timerInterval);
                alert(`CHÚC MỪNG! Bài học hoàn tất.\nKết quả: ${score}/${currentSession.length}`);
                location.reload();
            }
        }
    </script>
</body>
</html>
