<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop English Learning Game Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .drop-target { min-height: 52px; transition: all 0.2s ease; }
        .drag-item { cursor: grab; user-select: none; transition: transform 0.15s ease, background-color 0.15s ease; }
        .drag-item:active { cursor: grabbing; }
        .drag-item.dragging { opacity: 0.4; }
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            #lock-screen, #setup-screen, #game-screen, .no-print { display: none !important; }
            #print-section { display: block !important; }
            .print-page { page-break-after: always; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 15mm; box-sizing: border-box; }
            .print-page:last-child { page-break-after: avoid; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- MÀN HÌNH 1: NHẬP MẬT KHẨU -->
    <div id="lock-screen" class="w-full max-w-md bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl text-center">
        <div class="text-5xl mb-4">🔐</div>
        <h2 class="text-2xl font-bold mb-6 text-sky-400">Mật mã bí mật</h2>
        <input type="password" id="pass-input" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl text-center text-2xl mb-4 text-white outline-none focus:border-sky-500" placeholder="Nhập mật mã của bạn..." autocomplete="off">
        <button onclick="checkPass()" class="w-full bg-sky-500 py-4 rounded-2xl font-bold hover:bg-sky-600 transition-all text-lg shadow-lg">VÀO GAME</button>
    </div>

    <!-- MÀN HÌNH 2: THIẾT LẬP BÀI HỌC -->
    <div id="setup-screen" class="w-full max-w-xl bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl hidden">
        <h2 class="text-2xl font-bold mb-6 text-emerald-400 text-center">Thiết lập bài học Kéo & Thả</h2>
        
        <label class="block mb-6 bg-slate-800 p-6 rounded-2xl cursor-pointer border border-dashed border-slate-600 hover:bg-slate-700 transition-all text-center">
            <span id="file-status" class="text-slate-300 font-medium">📁 Nạp file CSV (3 cột: Chủ đề, Câu hỏi, Đáp án)</span>
            <input type="file" id="csv-file" accept=".csv" class="hidden">
        </label>
        
        <div id="topic-container" class="mb-6 hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-sky-400 uppercase font-bold tracking-wider">Chọn chủ đề</span>
                <button onclick="toggleAllTopics()" id="btn-all-topics" class="text-xs bg-sky-600 hover:bg-sky-700 px-3 py-1 rounded-lg font-bold text-white transition-all">ALL</button>
            </div>
            <div id="topic-list" class="max-h-48 overflow-y-auto bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 text-sm">
            <div>
                <span class="text-xs text-slate-400 block mb-1 uppercase font-semibold">Từ câu (From)</span>
                <input type="number" id="range-start" class="w-full bg-slate-800 p-3 rounded-xl text-center border border-slate-700 font-bold text-white" value="1">
            </div>
            <div>
                <span class="text-xs text-slate-400 block mb-1 uppercase font-semibold">Đến câu (To - Max: <span id="max-count">0</span>)</span>
                <input type="number" id="range-end" class="w-full bg-slate-800 p-3 rounded-xl text-center border border-slate-700 font-bold text-white" value="0">
            </div>
        </div>

        <button onclick="startSession()" class="w-full bg-emerald-500 py-4 rounded-2xl font-bold hover:bg-emerald-600 transition-all text-lg shadow-lg uppercase tracking-wider">Bắt đầu học ngay</button>
    </div>

    <!-- MÀN HÌNH 3: CHƠI CHÍNH -->
    <div id="game-screen" class="w-full max-w-5xl hidden">
        <div class="flex justify-between items-center mb-4 px-4 bg-slate-900 py-3 rounded-2xl border border-slate-800">
            <div class="flex items-center gap-4">
                <span id="session-progress" class="text-sky-400 font-mono font-bold">GAME: 1 / 1</span>
                <span id="score-display" class="text-emerald-400 font-bold tracking-wider uppercase text-sm bg-emerald-950/40 px-3 py-1 rounded-lg border border-emerald-900/40">Đúng: 0 / 0</span>
            </div>
            <button onclick="backToSetup()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-semibold transition-all">⚙ Cài đặt lại</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-6">
            <!-- Cột trái: Câu hỏi và ô thả (60%) -->
            <div class="md:col-span-7 bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800 shadow-xl flex flex-col justify-between">
                <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-4">Câu hỏi & Vùng thả đáp án</h3>
                <div id="questions-container" class="space-y-4 flex-1 flex flex-col justify-around"></div>
            </div>

            <!-- Cột phải: Các thẻ lựa chọn (40%) -->
            <div class="md:col-span-5 bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800 shadow-xl flex flex-col">
                <h3 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-4">Các lựa chọn (Kéo thả vào ô bên trái)</h3>
                <div id="choices-container" class="flex-1 bg-slate-950 p-4 rounded-2xl border border-slate-800/80 flex flex-col justify-around min-h-[320px]"></div>
            </div>
        </div>

        <!-- Thanh nút chức năng phía dưới -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-wrap gap-3 justify-between items-center">
            <div class="flex gap-3">
                <button onclick="prevGame()" id="btn-back-game" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all border border-slate-700">◀ BACK</button>
                <button onclick="nextGame()" id="btn-next-game" class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-md">NEXT ▶</button>
            </div>
            <div class="flex gap-3">
                <button onclick="refreshCurrentGame()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-md">🔄 REFRESH</button>
                <button onclick="checkAnswers()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-md">✔ CHECK</button>
                <button onclick="showAnswers()" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-md">💡 ANSWER</button>
                <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-md">🖨 PRINT PDF</button>
            </div>
        </div>
    </div>

    <!-- Khu vực in ấn PDF -->
    <div id="print-section" class="hidden"></div>

    <script>
        let fullData = [];
        let gameChunks = []; 
        let currentGameIdx = 0;
        let gameStates = {}; 
        let allTopicsSelected = true;
        const SECRET_PASS = "1234";

        function checkPass() {
            if (document.getElementById('pass-input').value === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'block';
            } else {
                alert("Sai mật mã!");
                document.getElementById('pass-input').value = "";
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPass();
        });

        function parseCSVLine(text) {
            let p = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p);
            return r;
        }

        document.getElementById('csv-file').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const lines = event.target.result.split(/\r?\n/);
                fullData = lines.map(line => {
                    if (!line.trim()) return null;
                    const cols = parseCSVLine(line);
                    return {
                        topic: cols[0]?.trim().replace(/^"|"$/g, ''),
                        q: cols[1]?.trim().replace(/^"|"$/g, ''),
                        ans: cols[2]?.trim().replace(/^"|"$/g, '')
                    };
                }).filter(item => item && item.topic && item.q && item.ans);

                document.getElementById('file-status').innerText = `✅ Đã nạp thành công ${fullData.length} câu`;
                buildTopicList();
                updateFilteredRange();
            };
            reader.readAsText(e.target.files[0]);
        });

        function buildTopicList() {
            const topics = [...new Set(fullData.map(item => item.topic))];
            const container = document.getElementById('topic-list');
            container.innerHTML = "";
            topics.forEach(topic => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-sm text-slate-300 cursor-pointer hover:text-white";
                label.innerHTML = `
                    <input type="checkbox" value="${topic}" checked class="topic-checkbox w-4 h-4 rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0" onchange="updateFilteredRange()">
                    <span class="truncate">${topic}</span>
                `;
                container.appendChild(label);
            });
            document.getElementById('topic-container').style.display = 'block';
            allTopicsSelected = true;
        }

        function toggleAllTopics() {
            allTopicsSelected = !allTopicsSelected;
            const checkboxes = document.querySelectorAll('.topic-checkbox');
            checkboxes.forEach(cb => cb.checked = allTopicsSelected);
            const btn = document.getElementById('btn-all-topics');
            btn.className = allTopicsSelected ? "text-xs bg-sky-600 hover:bg-sky-700 px-3 py-1 rounded-lg font-bold text-white transition-all" : "text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg font-bold text-slate-300 transition-all";
            updateFilteredRange();
        }

        function getSelectedTopics() {
            return Array.from(document.querySelectorAll('.topic-checkbox:checked')).map(cb => cb.value);
        }

        function getFilteredData() {
            const selected = getSelectedTopics();
            return fullData.filter(item => selected.includes(item.topic));
        }

        function updateFilteredRange() {
            const filtered = getFilteredData();
            document.getElementById('max-count').innerText = filtered.length;
            document.getElementById('range-start').value = filtered.length > 0 ? 1 : 0;
            document.getElementById('range-end').value = filtered.length;
        }

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('topic-checkbox')) updateFilteredRange();
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createChunks(totalCount) {
            let refined = [];
            let currentRem = totalCount;
            while (currentRem > 0) {
                let take = 8;
                if (currentRem - 8 < 6 && currentRem - 8 > 0) {
                    if (currentRem === 13) { take = 7; }
                    else if (currentRem === 12) { take = 6; }
                    else if (currentRem === 11) { take = 6; }
                    else if (currentRem === 10) { take = 5; }
                    else { take = 8; }
                }
                if (currentRem === 7) take = 7;
                if (currentRem === 6) take = 6;
                if (currentRem < 6) {
                    if (refined.length > 0) {
                        refined[refined.length - 1] += currentRem;
                        break;
                    } else {
                        take = currentRem;
                    }
                }
                refined.push(take);
                currentRem -= take;
            }
            return refined;
        }

        function startSession() {
            const filtered = getFilteredData();
            const start = parseInt(document.getElementById('range-start').value) - 1;
            const end = parseInt(document.getElementById('range-end').value);
            
            if (filtered.length === 0 || start < 0 || end > filtered.length || start >= end) {
                alert("Vui lòng kiểm tra lại khoảng câu hoặc chọn chủ đề!");
                return;
            }

            let selectedSlice = JSON.parse(JSON.stringify(filtered.slice(start, end)));
            shuffle(selectedSlice);

            let chunkSizes = createChunks(selectedSlice.length);
            gameChunks = [];
            let pointer = 0;
            chunkSizes.forEach(size => {
                let chunkItems = selectedSlice.slice(pointer, pointer + size);
                pointer += size;
                gameChunks.push(chunkItems);
            });

            currentGameIdx = 0;
            gameStates = {};

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            loadGameScreen(currentGameIdx);
        }

        function backToSetup() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }

        function loadGameScreen(idx) {
            currentGameIdx = idx;
            const chunk = gameChunks[idx];
            
            document.getElementById('session-progress').innerText = `GAME: ${idx + 1} / ${gameChunks.length}`;
            
            if (gameStates[idx]) {
                renderGameContent(gameStates[idx]);
            } else {
                let questions = chunk.map((item, i) => ({
                    id: i,
                    q: item.q,
                    correctAns: item.ans,
                    userAns: null,
                    status: 'normal'
                }));
                let choices = chunk.map((item, i) => ({
                    id: i,
                    text: item.ans
                }));
                shuffle(choices);

                let state = { questions, choices, checked: false };
                gameStates[idx] = state;
                renderGameContent(state);
            }
            updateScoreDisplay();
        }

        function renderGameContent(state) {
            const qContainer = document.getElementById('questions-container');
            const cContainer = document.getElementById('choices-container');
            
            qContainer.innerHTML = '';
            cContainer.innerHTML = '';

            state.questions.forEach((q, idx) => {
                let borderColor = 'border-slate-700';
                let textColor = 'text-white';
                if (q.status === 'correct') borderColor = 'border-emerald-500 bg-emerald-950/20';
                if (q.status === 'wrong') { borderColor = 'border-rose-500 bg-rose-950/20'; textColor = 'text-rose-300'; }
                if (q.status === 'revealed') { borderColor = 'border-purple-500 bg-purple-950/20'; textColor = 'text-purple-300'; }

                let div = document.createElement('div');
                div.className = `flex items-center justify-between bg-slate-950 p-4 rounded-2xl border-2 ${borderColor} transition-all`;
                div.innerHTML = `
                    <div class="flex-1 pr-4">
                        <span class="text-xs font-bold text-sky-400 mr-2">Q${idx + 1}.</span>
                        <span class="text-sm font-medium ${textColor}">${q.q}</span>
                    </div>
                    <div class="drop-target w-48 bg-slate-900 border-2 border-dashed border-slate-700 rounded-xl flex items-center justify-center p-2 text-sm font-semibold text-center cursor-pointer"
                         data-qid="${q.id}"
                         ondragover="allowDrop(event)"
                         ondrop="dropItem(event, ${q.id})"
                         onclick="clearDrop(${q.id})">
                        ${q.userAns ? `<span class="drag-item bg-sky-600 text-white px-3 py-1.5 rounded-lg shadow w-full inline-block truncate">${q.userAns}</span>` : '<span class="text-slate-500 text-xs italic">Thả đáp án vào đây</span>'}
                    </div>
                `;
                qContainer.appendChild(div);
            });

            state.choices.forEach(choice => {
                let isUsed = state.questions.some(q => q.userAns === choice.text);
                let choiceDiv = document.createElement('div');
                if (!isUsed) {
                    choiceDiv.className = `drag-item bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 p-3 rounded-xl text-sm font-semibold text-center shadow cursor-grab`;
                    choiceDiv.draggable = true;
                    choiceDiv.innerText = choice.text;
                    choiceDiv.ondragstart = (e) => dragStart(e, choice.text);
                    cContainer.appendChild(choiceDiv);
                } else {
                    let placeholder = document.createElement('div');
                    placeholder.className = `p-3 rounded-xl text-sm text-center text-slate-600 bg-slate-900/50 border border-dashed border-slate-800 line-through`;
                    placeholder.innerText = choice.text;
                    cContainer.appendChild(placeholder);
                }
            });
        }

        let draggedText = '';
        function dragStart(e, text) {
            draggedText = text;
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropItem(e, qid) {
            e.preventDefault();
            if (!draggedText) return;
            
            const state = gameStates[currentGameIdx];
            let q = state.questions.find(item => item.id === qid);
            if (q) {
                q.userAns = draggedText;
                q.status = 'normal';
            }
            draggedText = '';
            renderGameContent(state);
            updateScoreDisplay();
        }

        function clearDrop(qid) {
            const state = gameStates[currentGameIdx];
            let q = state.questions.find(item => item.id === qid);
            if (q && q.userAns) {
                q.userAns = null;
                q.status = 'normal';
                renderGameContent(state);
                updateScoreDisplay();
            }
        }

        function updateScoreDisplay() {
            const state = gameStates[currentGameIdx];
            if (!state) return;
            let answered = state.questions.filter(q => q.userAns !== null).length;
            let correct = state.questions.filter(q => q.userAns && q.userAns.trim().toLowerCase() === q.correctAns.trim().toLowerCase()).length;
            document.getElementById('score-display').innerText = `Đúng: ${correct} / ${state.questions.length} (Đã trả lời: ${answered}/${state.questions.length})`;
        }

        function checkAnswers() {
            const state = gameStates[currentGameIdx];
            state.checked = true;
            let correctCount = 0;
            state.questions.forEach(q => {
                if (q.userAns && q.userAns.trim().toLowerCase() === q.correctAns.trim().toLowerCase()) {
                    q.status = 'correct';
                    correctCount++;
                } else {
                    q.status = 'wrong';
                }
            });
            renderGameContent(state);
            document.getElementById('score-display').innerText = `Đúng: ${correctCount} / ${state.questions.length}`;
        }

        function showAnswers() {
            const state = gameStates[currentGameIdx];
            state.questions.forEach(q => {
                q.userAns = q.correctAns;
                if (q.userAns && q.userAns.trim().toLowerCase() === q.correctAns.trim().toLowerCase()) {
                    q.status = 'correct';
                } else {
                    q.status = 'wrong';
                }
            });
            renderGameContent(state);
            updateScoreDisplay();
        }

        function refreshCurrentGame() {
            const chunk = gameChunks[currentGameIdx];
            let questions = chunk.map((item, i) => ({
                id: i,
                q: item.q,
                correctAns: item.ans,
                userAns: null,
                status: 'normal'
            }));
            let choices = chunk.map((item, i) => ({
                id: i,
                text: item.ans
            }));
            shuffle(choices);

            gameStates[currentGameIdx] = { questions, choices, checked: false };
            renderGameContent(gameStates[currentGameIdx]);
            updateScoreDisplay();
        }

        function nextGame() {
            if (currentGameIdx < gameChunks.length - 1) {
                currentGameIdx++;
                loadGameScreen(currentGameIdx);
            } else {
                alert("Bạn đã hoàn thành tất cả các game trong phiên này!");
            }
        }

        function prevGame() {
            if (currentGameIdx > 0) {
                currentGameIdx--;
                loadGameScreen(currentGameIdx);
            }
        }

        function exportPDF() {
            const printSec = document.getElementById('print-section');
            let htmlContent = '';

            gameChunks.forEach((chunk, idx) => {
                htmlContent += `
                    <div class="print-page">
                        <div>
                            <div style="border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                                <h2 style="font-size: 18pt; font-weight: bold; margin: 0;">ENGLISH LEARNING EXERCISE - GAME ${idx + 1}</h2>
                                <span style="font-size: 12pt;">Họ và tên: .......................................</span>
                            </div>
                            <div style="margin-bottom: 15px; font-weight: bold; font-size: 11pt;">Nội dung bài tập (Kéo thả / Điền từ):</div>
                            <ol style="margin: 0; padding-left: 20px; font-size: 11pt; line-height: 1.8;">
                `;

                chunk.forEach(item => {
                    htmlContent += `<li style="margin-bottom: 12px;">${item.q} <span style="display: inline-block; border-bottom: 1px dotted #000; width: 150px; margin-left: 10px;"></span></li>`;
                });

                htmlContent += `
                            </ol>
                        </div>
                        <div style="border-top: 1px solid #ccc; padding-top: 10px; text-align: center; font-size: 9pt; color: #666;">
                            Trang ${idx + 1} / ${gameChunks.length} - Được tạo bởi hệ thống học tập thông minh
                        </div>
                    </div>
                `;
            });

            printSec.innerHTML = htmlContent;
            window.print();
        }
    </script>
</body>
</html>
